name: Job Radar

on:
  schedule:
    # cron-job.org triggers this every 10 min via workflow_dispatch (GitHub's own
    # scheduler often runs hours late). This hourly schedule is just a backup.
    - cron: "17 * * * *"
  workflow_dispatch:          # lets you hit "Run workflow" manually
    inputs:
      test_alert:
        description: "Only send a test message to Telegram"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit seen.json back

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest seen.json, even if this run was queued behind another
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py ${{ inputs.test_alert && '--test-alert' || '' }}
      - name: Save seen jobs
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && exit 0
          git commit -m "radar: update seen jobs"
          git pull --rebase -X theirs origin main && git push

# Job Radar config. Edit freely; the script re-reads this every run.
#
# Each company line is  "slug" = "ats"  where ats is one of:
#   greenhouse | lever | ashby | smartrecruiters
# To add a company: open one of its job links. The URL tells you both values, e.g.
#   boards.greenhouse.io/acme/...   ->  "acme" = "greenhouse"
#   jobs.lever.co/acme/...          ->  "acme" = "lever"
#   jobs.ashbyhq.com/acme/...       ->  "acme" = "ashby"
#   jobs.smartrecruiters.com/Acme/  ->  "Acme" = "smartrecruiters"
#   recruiterflow.com/acme/jobs     ->  "acme" = "recruiterflow"
#   acme.mynexthire.com/...         ->  "acme" = "mynexthire"
#   acme.wd5.myworkdayjobs.com/en-US/AcmeCareers/...  ->  "acme.wd5/AcmeCareers" = "workday"
# A company on two systems:  "acme" = ["greenhouse", "ashby"]
# Then run:  python radar.py --check acme

[filters]
# A job alerts only if its title matches `role`, does NOT match `exclude`,
# and its location passes the location rules below. (Python regex, case-insensitive.)
role = '''software|\bsde\b|\bswe\b|developer|back[- ]?end|front[- ]?end|full[- ]?stack|platform engineer|infrastructure engineer|mobile engineer|android|\bios\b|data engineer|ml engineer|machine learning engineer|ai engineer|member of technical staff|new grad|graduate engineer|engineer(ing)? intern|intern.*(engineer|developer|sde|software)'''
exclude = '''senior|\bsr\.?\b|staff|principal|\blead\b|manager|director|head of|architect|\bvp\b|\biii\b|\biv\b|sales|solutions? engineer|support engineer|customer|field engineer|recruit|\btl\b|\bstl\b|engineer 3|\bl[4-9]\b|sde[- ]?(3|iii)|workday|servicenow|\bsap\b|\bmgr\b|vice president|\bavp\b|\bsvp\b|\b[slp]mts\b|digital associate|mainframe'''

# Locations that always pass.
india = '''india|bengaluru|bangalore|hyderabad|pune|mumbai|delhi|new delhi|gurgaon|gurugram|noida|chennai|kolkata|ahmedabad|jaipur|kochi'''
# A remote job passes only if every part of its location is a remote word or a
# global region. "Remote, Global" passes; "Remote - US" or "Warsaw (Remote)" doesn't.
remote = '''remote|fully remote|work from home|wfh|distributed'''
# Drop jobs asking for more than this many years. Only applied where the hiring
# system publishes it (currently MyNextHire: CoinDCX, AngelOne).
max_experience = 2

global_region = '''global|worldwide|anywhere|international|apac|asia|asia[- ]pacific|india'''

